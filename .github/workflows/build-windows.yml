name: Build Windows Client
on:
  push:
    branches: [cliente]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Agent
        run: dotnet publish src/Itsqmet.ExamAgent/Itsqmet.ExamAgent.csproj -c Release -r win-x64 --self-contained true -o artifacts/package/Agent
      - name: Publish Service
        run: dotnet publish src/Itsqmet.ExamService/Itsqmet.ExamService.csproj -c Release -r win-x64 --self-contained true -o artifacts/package/Service
      - name: Copy installer and browser companion
        shell: pwsh
        run: |
          Copy-Item installer artifacts/package/installer -Recurse
          Copy-Item browser-companion artifacts/package/browser-companion -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: ITSQMET-Examen-Seguro-Windows
          path: artifacts/package
          retention-days: 30
